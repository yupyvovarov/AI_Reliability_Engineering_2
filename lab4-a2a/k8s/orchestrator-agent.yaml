apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-agent
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-agent
  template:
    metadata:
      labels:
        app: orchestrator-agent
    spec:
      containers:
        - name: orchestrator-agent
          image: orchestrator-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: TIME_AGENT_URL
              value: "http://time-agent:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-agent
  namespace: kagent
spec:
  selector:
    app: orchestrator-agent
  ports:
    - port: 8080
      targetPort: 8080
